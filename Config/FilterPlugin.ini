[FilterPlugin]
; Instant Organic Caves - Fab submission filter.
;
; Controls exactly which files BuildPlugin copies into the packaged plugin. Anything not
; matched by an include rule below is left out, and a trailing exclusion removes what an
; earlier wildcard would otherwise have swept in.
;
; The rule of thumb: a file ships only if the plugin reads it at runtime, or the customer
; needs it. Everything that exists to *produce* those files is build input and stays out.

; ---------------------------------------------------------------- code and content

; C++ source and module rules. Fab distributes code plugins as source.
/Source/...

; Shipped assets. CanContainContent is true, so these are the plugin's own content:
; the demo map, the eight scatter meshes, materials, textures and the PCG graphs.
/Content/...

; This file. UBT reads it back when the plugin is rebuilt from the package.
/Config/...

; ------------------------------------------------------------------- resources
;
; Resources/ is included wholesale and then trimmed, because most of what lives there is
; authoring input rather than product.

/Resources/...

; Authoring helpers. These write into the plugin's own Content folder, which is read-only
; once installed, so they cannot run on a customer machine -- and they regenerate the very
; assets already shipped above. Build process, not product.
-/Resources/GenerateMathMaterial.py
-/Resources/GenerateScatterMeshes.py
-/Resources/GenerateWizardArt.py
-/Resources/GenerateDemoMap.py
-/Resources/SetMaterialRenderFlags.py
-/Resources/SetupPBRTextures.py
-/Resources/IOC_Setup.py
-/Resources/IOC_CreateShowcaseMap.py

; Seed record for the generated scatter library: the input that makes those eight meshes
; reproducible. Kept in version control, no use to a customer.
-/Resources/ScatterSeeds.json

; Master images for the three shipped rock textures (~6.2 MB, about ten times the rest of
; Resources combined). The imported textures are already in Content/.
-/Resources/SourceTextures/...

; Full-resolution key art that GenerateWizardArt.py derives the wizard's chrome from. The
; derived images in Resources/UI do ship; these originals are build input.
-/Resources/UI/_source/...

; What survives the trimming, and why each is needed:
;   Resources/Icon128.png     the plugin's icon in the editor and in Fab
;   Resources/UI/*.png|jpg    loaded at runtime by FIOCWizardStyle for the Setup Wizard
;   Resources/Docs/*          the manual and tutorial, opened by Tools > Open Documentation

; ---------------------------------------------------------------------- root files

/InstantOrganicCaves.uplugin
/Changelog.md

; ------------------------------------------------------------------- exclusions
;
; Belt and braces. BuildPlugin does not copy these anyway, but an explicit rule means a
; stale local build cannot leak into a submission.

-/Binaries/...
-/Intermediate/...
-/Saved/...
-/DerivedDataCache/...
-/.git/...
-/.github/...
-/.vs/...
-/.vscode/...
-/*.sln
-/*.suo
-/*.user
-/*.sdf
-/*.opensdf
-/*.VC.db
-/*.pdb
-/HostProject/...

; Internal engineering notes. Accurate, but written for the author rather than the customer.
-/PRODUCTION_READINESS.md
